name: Deploy to AWS S3 + CloudFront

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  deploy:
    name: Build and Deploy to AWS
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🏗️ Build React app
        run: npm run build
        env:
          # Disable treating warnings as errors in CI
          CI: false
          # Increase Node.js memory limit to prevent out-of-memory errors
          NODE_OPTIONS: "--max-old-space-size=4096"
          # Add your environment variables here
          REACT_APP_API_BASE_URL: ${{ secrets.REACT_APP_API_BASE_URL }}
          # Add other REACT_APP_* variables as needed
          # REACT_APP_OTHER_VAR: ${{ secrets.REACT_APP_OTHER_VAR }}
      
      - name: 🔑 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1
      
      - name: 🚀 Deploy to S3
        run: |
          aws s3 sync dist/ s3://${{ secrets.AWS_S3_BUCKET }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "service-worker.js" \
            --exclude "asset-manifest.json"
          
          # Upload index.html and other files with no-cache
          aws s3 cp dist/index.html s3://${{ secrets.AWS_S3_BUCKET }}/index.html \
            --cache-control "public, max-age=0, must-revalidate"
          
          if [ -f dist/service-worker.js ]; then
            aws s3 cp dist/service-worker.js s3://${{ secrets.AWS_S3_BUCKET }}/service-worker.js \
              --cache-control "public, max-age=0, must-revalidate"
          fi
          
          if [ -f dist/asset-manifest.json ]; then
            aws s3 cp dist/asset-manifest.json s3://${{ secrets.AWS_S3_BUCKET }}/asset-manifest.json \
              --cache-control "public, max-age=0, must-revalidate"
          fi
      
      - name: 🔄 Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
      
      - name: ✅ Deployment successful
        run: |
          echo "🎉 Deployment completed successfully!"
          echo "Your app is now live on CloudFront"